&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }

      },
    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }

        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );

      throw persistenceError();
    }

    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

;Use test code 123456. All payment, account, price and ranking data are simulated; no real transaction occurs.&lt;/dd&gt;&lt;dt&gt;Funding assumptions&lt;/dt&gt;&lt;dd&gt;Accounts, card and bank options are proposed example layouts. Provider fees, limits, processing times, authentication, and native routing require App-team confirmation. No real payment details are used.&lt;/dd&gt;&lt;dt&gt;Trading preview&lt;/dt&gt;&lt;dd&gt;Quotes and execution are simulated. Position time advances to 3m 12s for the qualifying-close example. Actual account limits, margin, hedging, and volume checks must come from the trading backend.&lt;/dd&gt;&lt;dt&gt;Deposit refresh&lt;/dt&gt;&lt;dd&gt;A pending deposit advances to credited when Refresh Deposit Status is selected, without changing reviewer controls. Production refresh must use the provider’s confirmed status and must never credit on a button click alone.&lt;/dd&gt;&lt;dt&gt;Leaderboard preview&lt;/dt&gt;&lt;dd&gt;Masked names and points are fictional. Use Simulate Ranking Update to deliver a local sample snapshot and see standings reorder without an in-App refresh. Production real-time updates require a campaign-engine feed. A connection-loss state preserves the last snapshot and timestamp. Top 3 visibility is a user-requested change from BRD §6.2.&lt;/dd&gt;&lt;dt&gt;Settlement preview&lt;/dt&gt;&lt;dd&gt;Refresh Result advances the demo to the selected outcome. This is not a promise of immediate settlement. Prediction hours and settlement parameters remain TBC.&lt;/dd&gt;&lt;dt&gt;Campaign fields&lt;/dt&gt;&lt;dd&gt;Cashback release date and receiving account remain TBC. Cross-account aggregation is the intended experience, subject to technical confirmation.&lt;/dd&gt;&lt;/dl&gt;&lt;/details&gt;&lt;div id=&quot;ww-note&quot; class=&quot;ww-reviewnote&quot;&gt;Layout first: assess information order, next actions, and reward clarity. Timing and payout details remain TBC.&lt;/div&gt;

  function rules(){return `&lt;h1&gt;Rules and Eligibility&lt;/h1&gt;&lt;div class=&quot;ww-banner&quot;&gt;&lt;strong&gt;Join before your first deposit.&lt;/strong&gt;&lt;/div&gt;&lt;details open&gt;&lt;summary&gt;Who can participate?&lt;/summary&gt;&lt;p class=&quot;ww-small&quot;&gt;Eligible new and unfunded retail clients with approved KYC. Eligibility uses all accounts under the same KYC ID. Country and account exclusions apply.&lt;/p&gt;&lt;p class=&quot;ww-small&quot;&gt;Before KYC approval, you can read campaign mechanics but cannot enroll or perform campaign actions.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;How do missions work?&lt;/summary&gt;&lt;p&gt;Each paired USD50 qualifying deposit and 0.5 standard lots of qualifying closed XAUUSD volume earns 5 Snowmen Tokens. Unmatched progress carries forward during this round.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;What are the prediction rules?&lt;/summary&gt;&lt;p&gt;One submission per target trading day, using 1–5 tokens. No editing or cancellation. Correct predictions award one Candy Cane per token; unchanged prices produce a Void result and refund.&lt;/p&gt;&lt;p&gt;Opening and cutoff: TBC. Settlement pricing details and timing: TBC.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;How are rewards calculated?&lt;/summary&gt;&lt;p&gt;USD10 base milestone plus up to USD50 from the first 50 Candy Canes. Both are adjusted by retained qualifying net deposits and final checks.&lt;/p&gt;&lt;p&gt;Leaderboard Points = earned Snowmen Tokens + Candy Canes. Provisional percentile is shown across all participants. Grand-prize winners are selected only from qualifying participants.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;What happens after invalid activity is confirmed?&lt;/summary&gt;&lt;p&gt;Final entitlement excludes invalidated tokens and attributable Candy Cane rewards. Prediction history remains intact, with a visible reward adjustment.&lt;/p&gt;&lt;/details&gt;&lt;   const extraScreens={fundAmount:&#x27;Make a Deposit&#x27;,fundAccount:&#x27;Choose Account&#x27;,fundMethod:&#x27;Payment Method&#x27;,fundReview:&#x27;Review Deposit&#x27;,fundPayment:&#x27;Payment&#x27;,fundResult:&#x27;Deposit Status&#x27;,fundAuth:&#x27;Verify Payment&#x27;,instrument:&#x27;XAUUSD&#x27;,orderTicket:&#x27;Trade XAUUSD&#x27;,orderReview:&#x27;Review Order&#x27;,positions:&#x27;Open Positions&#x27;,closePosition:&#x27;Close Position&#x27;,tradeResult:&#x27;Trade Details&#x27;,activityDetail:&#x27;Activity Details&#x27;};

  const escapeText=v=&gt;String(v).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const step=(n,total=4)=&gt;`&lt;div class=&quot;ww-steps-top&quot; aria-label=&quot;Step ${n} of ${total}&quot;&gt;${Array.from({length:total},(_,i)=&gt;`&lt;span class=&quot;${i&lt;n?&#x27;is-done&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
  const row=(label,value)=&gt;`&lt;div class=&quot;ww-listrow&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;strong&gt;${value}&lt;/strong&gt;&lt;/div&gt;`;
  const screenIntro=(eyebrow,title,copy=&#x27;&#x27;)=&gt;`&lt;div class=&quot;ww-eyebrow&quot;&gt;${eyebrow}&lt;/div&gt;&lt;h1&gt;${title}&lt;/h1&gt;${copy?`&lt;p class=&quot;ww-small&quot;&gt;${copy}&lt;/p&gt;`:&#x27;&#x27;}`;
  const icon=(name)=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  const doButton=(label,action,disabled=false,secondary=false)=&gt;btn(label,`data-do=&quot;${action}&quot;`,disabled,secondary);
  function ensureLive(){if(!journey.live){const n=numbers();journey.live={...n,retained:state.withdrawal?n.earned*5:n.deposit};}return journey.live;}
  function updateMissions(){const n=ensureLive(),cycles=Math.min(Math.floor((n.deposit+.000001)/50),Math.floor((n.lots+.000001)/.5));const earned=cycles*5;const delta=Math.max(0,earned-n.earned);n.earned+=delta;n.available+=delta;if(delta)journey.ledger.unshift({id:&#x27;tokens-&#x27;+Date.now(),title:&#x27;Mission tokens added&#x27;,amount:&#x27;+&#x27;+delta+&#x27; tokens&#x27;,status:&#x27;Issued&#x27;,copy:&#x27;Both qualifying deposit and eligible closed-volume requirements were completed.&#x27;,tokens:delta});return delta;}
  function syncPerson(){const n=ensureLive();if(receipt())return;state.person=n.available&gt;0?&#x27;tokens&#x27;:n.deposit&gt;=50?&#x27;deposit&#x27;:n.lots&gt;=.5?&#x27;volume&#x27;:&#x27;enrolled&#x27;;}
  function startFunding(){journey.fundId++;journey.fundStatus=null;journey.error=&#x27;&#x27;;journey.copied=false;journey.amount=50;go(&#x27;fundAmount&#x27;);}
  function creditFunding(){if(journey.creditedId===journey.fundId)return;const n=ensureLive();n.deposit=Math.round((n.deposit+journey.amount)*100)/100;n.retained=Math.round((n.retained+journey.amount)*100)/100;journey.creditedId=journey.fundId;journey.ledger.unshift({id:&#x27;deposit-&#x27;+journey.fundId,title:&#x27;Deposit credited&#x27;,amount:&#x27;USD&#x27;+money(journey.amount),status:&#x27;Credited&#x27;,copy:&#x27;External funding credited after enrollment to trading account ••&#x27;+journey.account+&#x27;.&#x27;});journey.newTokens=updateMissions();syncPerson();}
  function processFunding(){journey.fundStatus=journey.fundResult;if(journey.fundStatus===&#x27;credited&#x27;)creditFunding();go(&#x27;fundResult&#x27;);}
  function amountValid(){return Number.isFinite(journey.amount)&amp;&amp;journey.amount&gt;0;}
  function fundingSummary(){return row(&#x27;Deposit amount&#x27;,&#x27;USD&#x27;+money(journey.amount))+row(&#x27;Trading account&#x27;,&#x27;••&#x27;+journey.account+&#x27; · USD&#x27;)+row(&#x27;Payment method&#x27;,journey.method===&#x27;card&#x27;?&#x27;Debit / credit card&#x27;:&#x27;Bank transfer&#x27;);}
  function errorMarkup(){return journey.error?`&lt;p class=&quot;ww-error&quot; role=&quot;alert&quot;&gt;${journey.error}&lt;/p&gt;`:&#x27;&#x27;;}
  function accountOptions(){return [&#x27;4108&#x27;,&#x27;7821&#x27;].map((id,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;ww-option&quot; data-account=&quot;${id}&quot; aria-pressed=&quot;${journey.account===id}&quot;&gt;&lt;span class=&quot;ww-option-icon&quot;&gt;USD&lt;/span&gt;&lt;span class=&quot;ww-option-body&quot;&gt;&lt;strong&gt;Trading account ••${id}&lt;/strong&gt;&lt;small&gt;${i?&#x27;Additional account&#x27;:&#x27;Primary account&#x27;} · USD&lt;br&gt;Same verified KYC identity&lt;/small&gt;&lt;/span&gt;&lt;span&gt;${journey.account===id?&#x27;✓&#x27;:&#x27;○&#x27;}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);}

  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
