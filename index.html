  const dashboardBeforeStoryboard=dashboard;
  dashboard=function(){let html=dashboardBeforeStoryboard();
    const hero=`&lt;section class=&quot;ww-story-hero&quot;&gt;&lt;div class=&quot;ww-brandrow&quot;&gt;${brandmark()}&lt;span&gt;App exclusive&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ww-story-title&quot;&gt;&lt;h1&gt;A Winter Full&lt;br&gt;&lt;em&gt;of Rewards&lt;/em&gt;&lt;/h1&gt;&lt;p&gt;Qualifying missions. Daily gold predictions.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ww-story-scene&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ww-story-podium&quot;&gt;&lt;/div&gt;&lt;img class=&quot;ww-story-snowman&quot; src=&quot;${storyboard.snowman}&quot; alt=&quot;&quot;&gt;&lt;img class=&quot;ww-story-candy&quot; src=&quot;${storyboard.candy}&quot; alt=&quot;&quot;&gt;&lt;i data-lucide=&quot;snowflake&quot; class=&quot;ww-story-flake&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;ww-season-dates&quot;&gt;1 Dec 2026–15 Jan 2027 · GMT+2&lt;/div&gt;&lt;/section&gt;`;
    html=html.replace(/&lt;section class=&quot;ww-campaign-hero&quot;&gt;[\s\S]*?&lt;\/section&gt;/,hero);
    return html;
  };
  function applyStoryboardVisuals(){
    root.style.setProperty(&#x27;--ww-story-background&#x27;,`url(&quot;${storyboard.background}&quot;)`);
    root.dataset.storyboard=&#x27;on&#x27;;
    const phone=root.querySelector(&#x27;.ww-phone&#x27;);
    phone.dataset.surface=[&#x27;dashboard&#x27;,&#x27;builder&#x27;,&#x27;prediction&#x27;,&#x27;stash&#x27;,&#x27;activity&#x27;,&#x27;rules&#x27;,&#x27;activityDetail&#x27;].includes(state.screen)?&#x27;campaign&#x27;:&#x27;transaction&#x27;;
    for(const icon of root.querySelectorAll(&#x27;#ww-content i[data-lucide=&quot;candy-cane&quot;],#ww-content svg.lucide-candy-cane&#x27;)){
      const img=document.createElement(&#x27;img&#x27;);img.src=storyboard.candy;img.alt=&#x27;&#x27;;img.className=&#x27;ww-candy-art&#x27;;icon.replaceWith(img);
    }
    for(const img of root.querySelectorAll(&#x27;#ww-content .ww-mini-globe&#x27;)){img.src=storyboard.snowman;img.alt=&#x27;&#x27;;img.classList.add(&#x27;ww-story-mini&#x27;);}
    for(const img of root.querySelectorAll(&#x27;.ww-token-sculpture&#x27;))img.alt=&#x27;Snowman wearing a blue hat and scarf, with a blue snowflake on its body&#x27;;
    for(const heading of root.querySelectorAll(&#x27;#ww-content h3&#x27;)){
      const name=heading.textContent;
      if(state.screen===&#x27;builder&#x27;&amp;&amp;[&#x27;Qualifying Deposit&#x27;,&#x27;Eligible Trading Volume&#x27;].includes(name)){
        const mark=document.createElement(&#x27;span&#x27;);mark.className=&#x27;ww-story-mission-icon&#x27;;mark.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);mark.innerHTML=`&lt;i data-lucide=&quot;${name===&#x27;Qualifying Deposit&#x27;?&#x27;wallet&#x27;:&#x27;chart-candlestick&#x27;}&quot;&gt;&lt;/i&gt;`;heading.prepend(mark);
      }
    }
    // Restrained visual response only; values and actions remain immediately available.
    root.querySelectorAll(&#x27;.ww-allocation-token,.ww-stat-token,.ww-token-balance img,.ww-token-quantity img&#x27;).forEach(img=&gt;img.classList.add(&#x27;ww-story-token&#x27;));
  }

  function render(){
    root.style.setProperty(&#x27;--ww-sculpture-display&#x27;,state.artwork?&#x27;block&#x27;:&#x27;none&#x27;);
    root.dataset.motion=journey.motion?&#x27;on&#x27;:&#x27;off&#x27;;
    if([&#x27;orderTicket&#x27;,&#x27;orderReview&#x27;].includes(state.screen)&amp;&amp;!journey.side)state.screen=&#x27;instrument&#x27;;
    if(state.screen===&#x27;closePosition&#x27;&amp;&amp;(!journey.position||journey.position.remaining&lt;=0))state.screen=&#x27;positions&#x27;;
    root.style.setProperty(&#x27;--ww-winter-scene&#x27;,`url(&quot;${art.hero}&quot;)`);
    root.dataset.screen=state.screen;
    const allowed=allowedScreens();
    if(!allowed.includes(state.screen))state.screen=&#x27;dashboard&#x27;;
    screenSelect.replaceChildren(...screenOptions.filter(o=&gt;allowed.includes(o.value)).map(o=&gt;new Option(o.label,o.value)));
    screenSelect.value=state.screen;stateSelect.value=state.person;
    const help=root.querySelector(&#x27;#ww-header-help&#x27;);
    help.textContent=enrolled()?&#x27;Terms&#x27;:&#x27;Rules&#x27;;
    if(enrolled()){delete help.dataset.go;help.dataset.action=&#x27;terms&#x27;;}else{delete help.dataset.action;help.dataset.go=&#x27;rules&#x27;;}
    root.querySelector(&#x27;#ww-note&#x27;).textContent=enrolled()?&#x27;Enrolled experience · account aggregation requires App-team confirmation. Timing and payout details remain TBC.&#x27;:&#x27;Before enrollment: explore the Dashboard and Rules &amp; Eligibility. Participation screens unlock after enrollment.&#x27;;
    root.querySelector(&#x27;#ww-title&#x27;).textContent=extraScreens[state.screen]||{dashboard:&#x27;Winter Wonderland&#x27;,builder:&#x27;Snowmen Token Builder&#x27;,prediction:&#x27;Today’s Call&#x27;,stash:&#x27;Your Stash&#x27;,activity:&#x27;Campaign Activity&#x27;,rules:&#x27;Rules and Eligibility&#x27;}[state.screen];
    content.innerHTML=({...journeyScreens,dashboard,builder,prediction,stash,activity,rules})[state.screen]();
    content.innerHTML=content.innerHTML.replaceAll(&#x27;&lt;i data-lucide=&quot;snowflake&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;,`&lt;img class=&quot;ww-stat-token&quot; src=&quot;${art.token}&quot; alt=&quot;&quot;&gt;`);
    if(state.screen.startsWith(&#x27;fund&#x27;)&amp;&amp;state.screen!==&#x27;fundResult&#x27;){help.textContent=&#x27;Cancel&#x27;;delete help.dataset.go;delete help.dataset.action;help.dataset.do=&#x27;fund-cancel&#x27;;}else{delete help.dataset.do;}
    if(journey.live)root.querySelector(&#x27;#ww-note&#x27;).textContent=&#x27;Demo journey updated locally · payment, trading and settlement are simulated. No real transaction is made.&#x27;;
    content.innerHTML=customerCopy(content.innerHTML);
    campaignNavigation();
    syncReviewOutcomes();
    applyStoryboardVisuals();
    root.querySelectorAll(&#x27;button,summary&#x27;).forEach(b=&gt;b.classList.add(&#x27;cursor-interaction&#x27;));
    if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});

  }
  function setPerson(person){journey.fundId++;journey.creditedId=null;journey.live=null;journey.ledger=[];journey.position=null;journey.lastClose=null;journey.fundStatus=null;journey.error=&#x27;&#x27;;state.withdrawal=person===&#x27;withdrawal&#x27;;backStack=[];state.lockedBase=null;state.person=person;state.direction=null;state.count=1;state.lockedDirection=&#x27;Higher&#x27;;state.lockedCount=3;closeModal();render();persist();}
  screenSelect.addEventListener(&#x27;change&#x27;,()=&gt;go(screenSelect.value));
  stateSelect.addEventListener(&#x27;change&#x27;,()=&gt;setPerson(stateSelect.value));
  root.addEventListener(&#x27;click&#x27;,e=&gt;{
    const b=e.target.closest(&#x27;button&#x27;);if(!b||b.disabled)return;
    if(handleJourneyClick(b))return;
    if(b.dataset.go){if(b.dataset.go===&#x27;activity&#x27;)state.activity=state.screen===&#x27;prediction&#x27;?&#x27;predictions&#x27;:&#x27;tokens&#x27;;go(b.dataset.go);return;}
    if(b.dataset.direction){state.direction=b.dataset.direction;render();content.querySelector(`[data-direction=&quot;${state.direction}&quot;]`)?.focus();return;}
    if(b.dataset.count){state.count=Number(b.dataset.count);render();content.querySelector(`[data-count=&quot;${state.count}&quot;]`)?.focus();return;}
    if(b.dataset.segment){state.activity=b.dataset.segment;render();return;}
    const a=b.dataset.action;
    if(a===&#x27;back&#x27;){state.screen=backStack.pop()||&#x27;dashboard&#x27;;render();persist();}
    if(a===&#x27;close&#x27;)closeModal();
    if(a===&#x27;join&#x27;){
      const messages={deposit:&#x27;This promotion is only for clients who haven’t made their first deposit yet.&#x27;,excluded:&#x27;Your account type isn’t eligible for this promotion.&#x27;,already:&#x27;You’re already enrolled in Winter Wonderland. View your campaign progress.&#x27;,error:&#x27;We couldn’t check your eligibility. Please try again.&#x27;};
      if(state.enrollmentOutcome!==&#x27;eligible&#x27;)modal(&#x27;Enrollment status&#x27;,`&lt;p&gt;${messages[state.enrollmentOutcome]}&lt;/p&gt;`,btn(state.enrollmentOutcome===&#x27;already&#x27;?&#x27;View My Progress&#x27;:&#x27;Close&#x27;,state.enrollmentOutcome===&#x27;already&#x27;?&#x27;data-action=&quot;joined&quot;&#x27;:&#x27;data-action=&quot;close&quot;&#x27;));
      else modal(&#x27;Join Winter Wonderland&#x27;,`&lt;p&gt;Join before your first deposit. Only qualifying activity after enrollment counts.&lt;/p&gt;&lt;p class=&quot;ww-small&quot;&gt;Cashback is subject to deposit retention and final checks.&lt;/p&gt;&lt;p class=&quot;ww-small&quot;&gt;Prototype only: no enrollment will be sent.&lt;/p&gt;`,btn(&#x27;Confirm Enrollment&#x27;,&#x27;data-action=&quot;joined&quot;&#x27;)+btn(&#x27;Back&#x27;,&#x27;data-action=&quot;close&quot;&#x27;,false,true));
